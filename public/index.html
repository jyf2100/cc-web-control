<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Roc-CC Remote Control</title>
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <!-- NL logo(左上角):内联 SVG 小老虎 + CSS 绘制 NL 字样;颜色全部引用 tokens.css 主题变量,明暗主题自动适配 -->
    <style>
        .brand-logo-lockup { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
        .brand-logo { width: 18px; height: 18px; display: block; }
        .brand-nl {
            font-family: var(--mono); font-size: 11px; font-weight: 700;
            letter-spacing: 0.04em; line-height: 1; color: var(--accent-2);
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Roc-CC">
    <meta name="theme-color" content="#f7f2e9">
</head>
<body>
    <div id="app">
        <!-- 控制台卡片容器:header + main 同宽对齐 -->
        <div class="console-card">
            <!-- 顶部:精简为 brand + live + 极简 session(只 s);控件入底部「切换」抽屉 -->
            <header class="header header--single">
                <div class="header-left">
                    <span class="brand" aria-label="Roc-CC Remote Control">
                        <span class="brand-logo-lockup" aria-hidden="true">
                            <!-- 风格化小老虎:耳朵(accent-2)→ 头(accent)→ 条纹/五官(fg)→ 口鼻(bg);取代旧 CSS 方块 -->
                            <svg class="brand-logo" viewBox="0 0 32 32" focusable="false">
                                <circle cx="8.2" cy="8.6" r="3.6" fill="var(--accent-2)"/>
                                <circle cx="23.8" cy="8.6" r="3.6" fill="var(--accent-2)"/>
                                <circle cx="8.2" cy="8.6" r="1.5" fill="var(--accent)"/>
                                <circle cx="23.8" cy="8.6" r="1.5" fill="var(--accent)"/>
                                <path d="M16 5.6 C22.4 5.6 26.8 10 26.8 16.4 C26.8 23 22.4 27.4 16 27.4 C9.6 27.4 5.2 23 5.2 16.4 C5.2 10 9.6 5.6 16 5.6 Z" fill="var(--accent)"/>
                                <path d="M13.2 6.6 L13.2 10.4" stroke="var(--fg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                                <path d="M16 6.1 L16 10.1" stroke="var(--fg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                                <path d="M18.8 6.6 L18.8 10.4" stroke="var(--fg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                                <path d="M5.8 14.8 L9.2 15.4 M6.2 18.2 L9.6 17.8 M26.2 14.8 L22.8 15.4 M25.8 18.2 L22.4 17.8" stroke="var(--fg)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
                                <ellipse cx="16" cy="21.4" rx="5.6" ry="4" fill="var(--bg)"/>
                                <circle cx="12.4" cy="16.4" r="1.3" fill="var(--fg)"/>
                                <circle cx="19.6" cy="16.4" r="1.3" fill="var(--fg)"/>
                                <path d="M14.6 19.6 L17.4 19.6 L16 21.2 Z" fill="var(--fg)"/>
                                <path d="M16 21.2 L16 22.3 M16 22.3 C15.3 23.2 14 23.2 13.4 22.5 M16 22.3 C16.7 23.2 18 23.2 18.6 22.5" stroke="var(--fg)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
                            </svg>
                            <span class="brand-nl">NL</span>
                        </span>
                        <span class="brand-name">Roc-CC</span>
                    </span>
                    <span id="liveIndicator" class="live-dot" role="status" aria-live="polite">
                        <span class="live-dot-pulse" aria-hidden="true"></span>
                        <span class="live-dot-text">未连接</span>
                    </span>
                    <span class="meta-inline" role="group" aria-label="当前会话">
                        <span class="meta-label">s</span><span id="metaSession" class="meta-val">—</span>
                    </span>
                    <span class="meta-inline" role="group" aria-label="当前 effort 档位">
                        <span class="meta-label">effort</span><span id="metaEffort" class="meta-val">—</span>
                    </span>
                </div>
            </header>
            <!-- mods 风险横幅:本机 Claude Code mods/plugins 非空时由 client.js 显示(常驻提示) -->
            <div id="modsBanner" class="mods-banner" role="status" aria-live="polite" aria-label="mods 风险提示" hidden></div>
            <!-- 主内容区 -->
            <main class="main">
                <h1 class="visually-hidden">控制台</h1>
                <!-- 对话区域 -->
                <div id="chatContainer" class="chat-container">
                    <div id="messages" class="messages">
                        <div class="welcome-message">
                            <p class="eyebrow">[ ready ] · <span class="eyebrow-id">s:0n</span></p>
                            <h2>Roc-CC Remote Control</h2>
                            <p>终端输出会实时镜像，直接在终端面板底部输入并回车发送</p>
                        </div>
                    </div>
                </div>
                <!-- Toast 通知容器 -->
                <div id="toast-container" aria-label="通知" aria-live="polite" role="status"></div>
            </main>
        </div>

        <!-- 隐藏状态载体:控件移出 header,client.js 的 getElementById/value 仍可用,渲染走抽屉 -->
        <!-- 不含 refreshSessions(onOpen 自动刷新,该按钮已删) -->
        <div id="stateCarriers" hidden>
            <select id="sessionSelect" class="control-input"></select>
            <label id="projectControl" class="control"><select id="projectSelect" class="control-input"></select></label>
            <p id="projectsEmpty" class="projects-empty" hidden></p>
            <button id="startProject" class="btn" type="button">启动</button>
        </div>

        <!-- 底部 tab bar:≥768 常驻;≤768 终端输入聚焦时 CSS 折叠让位 -->
        <nav class="bottom-tabbar" aria-label="主导航">
            <a class="tab tab--active" href="/" aria-current="page"><span class="tab-icon" aria-hidden="true">▤</span><span class="tab-label">控制台</span></a>
            <a class="tab" href="/dashboard.html"><span class="tab-icon" aria-hidden="true">◫</span><span class="tab-label">看板</span></a>
            <button class="tab" type="button" id="switchTab" aria-haspopup="dialog" aria-expanded="false" aria-controls="switchSheet"><span class="tab-icon" aria-hidden="true">⇄</span><span class="tab-label">切换</span></button>
        </nav>
    </div>

    <script src="terminal_cleaner.cjs"></script>
    <script src="tmux_actions.cjs"></script>
    <script src="projectsView.cjs"></script>
    <script src="deadState.cjs"></script>
    <script src="effort.cjs"></script>
    <script src="session_switch.cjs"></script>
    <script src="switch_sheet.cjs"></script>
    <script src="client.js"></script>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
