<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Roc-CC Remote Control - Login</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roc-CC">
  <meta name="theme-color" content="#1c1815">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* 极简登录页样式,消费 tokens.css 令牌(方向 A 琥珀精修) */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: var(--r);
      background: var(--brand);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 18px;
      margin: 0 auto 18px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: var(--text); }
    p { margin: 8px 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
    label { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.35); }
    .row { margin-top: 18px; }
    button {
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
    }
    button:hover { background: var(--brand-strong); }
    .hint { font-size: 12px; }
    .error { margin-top: 12px; font-size: 13px; color: var(--errored); }
    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-mark">cc</div>
    <h1>Roc-CC Remote Control 登录</h1>
    <p class="hint">此页面需要 <code>CC_WEB_AUTH_TOKEN</code>。请输入 token 以继续。</p>

    <form method="POST" action="/login">
      <input id="next" name="next" type="hidden" value="/" />
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required />
      <div class="row">
        <button type="submit">登录</button>
      </div>
    </form>

    <p class="hint">注意：该服务可远程控制 tmux/Claude Code，请仅在可信设备与网络中使用，并妥善保管 token。</p>
  </div>
  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var next = url.searchParams.get('next');
        if (next && typeof next === 'string' && next.startsWith('/') && !next.startsWith('//')) {
          var el = document.getElementById('next');
          if (el) el.value = next;
        }
      } catch {}
    })();
  </script>
</body>
</html>
