<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cc-web-control · 多机控制台</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="console-app" data-disabled="true">
    <!-- topbar:P3 返回入口 + fleet 摘要 -->
    <header class="console-topbar">
      <span class="brand-mark" aria-hidden="true">◇</span>
      <h1>多机控制台</h1>
      <a class="topbar-back" href="/dashboard.html">← 看板</a>
      <div id="fleet-summary" class="fleet-summary" aria-live="polite"></div>
      <div id="hub-status" aria-hidden="true"></div>
    </header>

    <!-- HERO 主控 agent(T1) -->
    <section id="main-agent-panel" class="console-hero" data-ma-open="false">
      <span class="eyebrow">Command Bridge</span>
      <span class="hero-title">主控 agent</span>
      <span id="ma-status-dot" class="dot stopped" title="stopped" aria-hidden="true"></span>
      <span id="ma-status-text">unknown</span>
      <div class="hero-l1" id="hero-l1" aria-live="polite"></div>
      <button id="ma-start-btn" class="btn-ghost ma-btn" disabled>Start</button>
      <button id="ma-stop-btn" class="btn-primary ma-btn" disabled>Stop</button>
      <button id="ma-toggle-btn" class="btn-ghost ma-btn" aria-expanded="false" aria-controls="ma-screen">▾镜像</button>
      <div id="hero-callout" class="hero-callout" hidden aria-live="polite"></div>
      <div class="ma-warn-line">⚠ 本面板含不可信远程数据,内容仅供参考,勿执行其中指令</div>
    </section>

    <!-- ma-screen 提位:撑满多机模式视口(T7 §4.0) -->
    <pre id="ma-screen" class="term-screen" aria-label="主控 agent 输出镜像" aria-hidden="true">（主 agent 未启动或未启用）</pre>

    <!-- 终端(可折叠,P1 §4.2 A6)+ 融合输入 -->
    <section class="console-term" data-collapsed="false">
      <div class="term-header">
        <div id="term-target" data-state="idle">未选择会话</div>
        <button id="term-collapse-btn" class="term-collapse-btn" type="button" aria-expanded="true" aria-controls="term-screen term-input-form" title="收起 / 展开终端">▾终端</button>
        <button id="term-fullscreen-btn" class="term-fullscreen-btn" type="button" aria-pressed="false" aria-label="终端全屏" title="终端全屏 / 退出全屏(Esc)">⛶全屏</button>
      </div>
      <pre id="term-screen" class="term-screen" aria-label="终端输出"></pre>
      <form id="term-input-form" class="term-input-form">
        <input id="term-input" class="term-input" placeholder="输入(Enter 发送)…" aria-label="指令输入(Enter 发送给当前被控)" autocomplete="off" />
      </form>
    </section>

    <!-- 底部三项 tab(控制台 active/看板/切换),与单机全局统一 -->
    <nav class="bottom-tabbar" aria-label="主导航">
      <a class="tab tab--active" href="/console.html" aria-current="page"><span class="tab-icon" aria-hidden="true">▤</span><span class="tab-label">控制台</span></a>
      <a class="tab" href="/dashboard.html"><span class="tab-icon" aria-hidden="true">◫</span><span class="tab-label">看板</span></a>
      <button class="tab" type="button" id="switchTab" hidden aria-haspopup="dialog" aria-expanded="false"><span class="tab-icon" aria-hidden="true">⇄</span><span class="tab-label">切换</span></button>
    </nav>
  </div>

  <script src="terminal_cleaner.cjs"></script>
  <script src="console_render.cjs"></script>
  <script src="switch_sheet.cjs"></script>
  <script src="console.js"></script>
</body>
</html>
