<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CC 看板</title>
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Roc-CC">
    <meta name="theme-color" content="#f2f1ed">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="logo">
                <img class="app-logo" src="logo.png" alt="Roc-CC" width="24" height="24" onerror="this.hidden=true;">
                <span id="title">CC 看板</span>
            </div>
            <div id="fleet-summary" class="fleet-summary" aria-live="polite" hidden></div>
            <span id="board-stale" class="board-stale" aria-live="polite" hidden></span>
            <form class="topbar-logout-form" method="post" action="/logout">
                <button class="topbar-logout-btn" type="submit">登出</button>
            </form>
        </header>
        <main class="main">
            <h1 class="visually-hidden">CC 看板</h1>
            <!-- 单机模式:session-list(dashboard_render 渲染) -->
            <ul id="sessionList" class="session-list" aria-label="会话列表"></ul>
            <!-- hub 模式:按 CLI 工具过滤(dashboard.js 在 ≥2 种工具时注入 chip;hidden 默认)-->
            <div id="cli-filter-bar" class="cli-filter-bar" role="group" aria-label="按 CLI 工具过滤" hidden></div>
            <!-- hub 模式:按机分节容器(renderBoard 塞 <li class="machine-group">;组内 .board-grid 才是卡片网格)-->
            <ul id="board-body" class="board-body" aria-label="机器会话看板" hidden></ul>
            <div id="stateMessage" class="state-message" hidden></div>
        </main>

        <!-- hub 模式:受监督自主运行指标面板(commit / rollback / 人工干预,1h/24h/7d 窗口)-->
        <section id="autonomy-panel" class="autonomy-panel" hidden aria-label="自主运行指标">
            <div class="autonomy-panel__head">
                <div class="autonomy-panel__title">
                    <span class="autonomy-panel__name">自主运行指标</span>
                    <span class="autonomy-panel__hint">commit / rollback / 人工干预 · 衡量「受监督自主运行」程度</span>
                </div>
                <div class="autonomy-window" role="group" aria-label="时间窗口">
                    <button type="button" class="autonomy-window__btn" data-window="1h" aria-pressed="false">1h</button>
                    <button type="button" class="autonomy-window__btn" data-window="24h" aria-pressed="true">24h</button>
                    <button type="button" class="autonomy-window__btn" data-window="7d" aria-pressed="false">7d</button>
                </div>
            </div>
            <div id="autonomy-body" class="autonomy-body" aria-live="polite"></div>
        </section>

        <!-- 三页面:扇出 bar(选中卡片后显示,Enter 广播,不跳控制台)-->
        <form id="fanout-bar" class="fanout-bar" hidden>
            已选 <span class="sel-count" id="sel-count">0</span>
            <button class="sel-clear" id="sel-clear" type="button">清除</button>
            <input class="term-input" id="fanout-input" placeholder="输入(Enter 扇出)…" autocomplete="off" aria-label="扇出指令输入" />
            <span class="term-badge" id="bc-count" hidden></span>
            <span class="bc-result" id="bc-result" aria-live="polite"></span>
        </form>

    </div>
    <script src="terminal_cleaner.cjs"></script>
    <script src="board_render.cjs"></script>
    <script src="dashboard_render.cjs"></script>
    <script src="dashboard.js"></script>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
